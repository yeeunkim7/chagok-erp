# Standalone recovery drill. Never combine with compose.yaml using -f.
name: chagok-backup-check

x-database: &database
  image: postgres:17-bookworm@sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536
  entrypoint: ["/bin/sh", "/opt/docker/postgres-entrypoint.sh"]
  command: ["postgres"]
  environment:
    POSTGRES_USER: postgres
    POSTGRES_DB: postgres
    POSTGRES_PASSWORD_FILE: /run/secrets/admin_test
    POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    APP_DB_USER: chagok_test
    APP_DB_NAME: reconciliation_test
    APP_DB_PASSWORD_FILE: /run/secrets/app_test
  secrets: [admin_test, app_test]
  healthcheck:
    test: [CMD-SHELL, 'PGPASSWORD="$$(cat "$$APP_DB_PASSWORD_FILE")" psql --no-psqlrc --no-password -h 127.0.0.1 -U chagok_test -d reconciliation_test -Atc "SELECT 1" >/dev/null']
    interval: 3s
    timeout: 3s
    retries: 30

x-api: &api
  image: ${CHAGOK_BACKUP_APP_IMAGE:-chagok-backend:local}
  profiles: [app]
  user: "0:0"
  secrets: [app_test]

services:
  db-source:
    <<: *database
    networks: [source]
    volumes:
      - source-data:/var/lib/postgresql/data
      - ./docker/postgres-entrypoint.sh:/opt/docker/postgres-entrypoint.sh:ro
      - ./docker/init-app-db.sh:/docker-entrypoint-initdb.d/10-app-db.sh:ro

  db-restore:
    <<: *database
    networks: [restore]
    volumes:
      - restore-data:/var/lib/postgresql/data
      - ./docker/postgres-entrypoint.sh:/opt/docker/postgres-entrypoint.sh:ro
      - ./docker/init-app-db.sh:/docker-entrypoint-initdb.d/10-app-db.sh:ro

  source-api:
    <<: *api
    environment:
      DB_URL: jdbc:postgresql://db-source:5432/reconciliation_test
      DB_USERNAME: chagok_test
      DB_PASSWORD_FILE: /run/secrets/app_test
      AI_API_KEY: ""
      APP_AI_ENABLED: "false"
    networks: [source]
    depends_on:
      db-source:
        condition: service_healthy

  restore-api:
    <<: *api
    environment:
      DB_URL: jdbc:postgresql://db-restore:5432/reconciliation_test
      DB_USERNAME: chagok_test
      DB_PASSWORD_FILE: /run/secrets/app_test
      AI_API_KEY: ""
      APP_AI_ENABLED: "false"
    networks: [restore]
    depends_on:
      db-restore:
        condition: service_healthy

secrets:
  admin_test:
    file: ./.local/docker-secrets/admin_test
  app_test:
    file: ./.local/docker-secrets/app_test

volumes:
  source-data:
  restore-data:

networks:
  source:
    internal: true
  restore:
    internal: true
