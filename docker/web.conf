worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 7m;
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;
        set $backend_origin http://backend:8080;

        # Keep the browser's port so Spring sees the same origin as the request.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;

        location = /api {
            proxy_pass $backend_origin$request_uri;
        }

        location ^~ /api/ {
            proxy_pass $backend_origin$request_uri;
        }

        location = /health {
            proxy_pass $backend_origin$request_uri;
        }

        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        # Missing assets fail rather than returning index.html as JavaScript.
        location ~* \.(?:js|css|png|jpe?g|gif|ico|svg|webp|woff2?|ttf|json|map)$ {
            try_files $uri =404;
        }

        # SPA fallback applies only after API/health and static-asset routes.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
